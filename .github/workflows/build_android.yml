name: Android Release Build

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3' # Automaticky stiahne stable verziu, prípadne zmeňte na vašu lokálnu
          channel: 'stable'
          cache: true

      - name: Set up Android Keystore
        run: |
          echo "${{ secrets.CM_KEYSTORE }}" | base64 --decode > /tmp/android_release_keystore.jks
          cat >> android/local.properties <<EOF
          releaseKeyStore=/tmp/android_release_keystore.jks
          releaseKeyStorePassword=${{ secrets.CM_KEYSTORE_PASSWORD }}
          releaseKeyAlias=${{ secrets.CM_KEY_ALIAS }}
          releaseKeyPassword=${{ secrets.CM_KEY_PASSWORD }}
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release --dart-define=BASE_URL=https://chudy.online --dart-define=APP_ENV=true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
