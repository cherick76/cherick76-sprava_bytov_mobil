workflows:
  android-release:
    name: android-release
    max_build_duration: 60
    instance_type: mac_mini_m2

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    environment:
      flutter: stable
      groups:
        - android-credentials

    scripts:
      - name: Set up keystore
        script: |
          printf '%s' "$CM_KEYSTORE" | base64 --decode > /tmp/android_release_keystore.jks
          cat >> android/local.properties <<EOF
          releaseKeyStore=/tmp/android_release_keystore.jks
          releaseKeyStorePassword=$CM_KEYSTORE_PASSWORD
          releaseKeyAlias=$CM_KEY_ALIAS
          releaseKeyPassword=$CM_KEY_PASSWORD
          EOF


      - name: Install dependencies
        script: flutter pub get

      - name: Analyze project
        script: flutter analyze

      - name: Run tests
        script: flutter test

      - name: Build release APK
        script: flutter build apk --release --dart-define=BASE_URL=https://sb.chudy.online --dart-define=APP_ENV=true

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk

