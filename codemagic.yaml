workflows:
  android-release:
    name: android-release
    max_build_duration: 60
    instance_type: linux

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    environment:
      flutter: stable
      android_signing:
        - keystore: android_release_keystore
          keystore_environment_variable: CM_KEYSTORE
          keystore_password_environment_variable: CM_KEYSTORE_PASSWORD
          key_alias_environment_variable: CM_KEY_ALIAS
          key_password_environment_variable: CM_KEY_PASSWORD

    scripts:
      - name: Install dependencies
        script: flutter pub get

      - name: Analyze project
        script: flutter analyze

      - name: Run tests
        script: flutter test

      - name: Build release APK
        script: flutter build apk --release --dart-define=BASE_URL=https://sb.chudy.online --dart-define=APP_ENV=true

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
